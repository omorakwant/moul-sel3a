name: lcarnet_b2b
description: "L'Carnet B2B — Morocco B2B Phone Accessory Ledger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Supabase (offline-first with PKCE auth) ──
  supabase_flutter: ^2.5.0

  # ── State Management ──
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # ── Routing ──
  go_router: ^14.0.0

  # ── Local Storage / Offline Cache ──
  shared_preferences: ^2.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.0

  # ── UI Utilities ──
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.0

  # ── Camera / Image ──
  image_picker: ^1.0.0

  # ── WhatsApp Deep Links ──
  url_launcher: ^6.2.0

  # ── Speech to Text (Darija/French) ──
  speech_to_text: ^6.6.0

  # ── Utilities ──
  uuid: ^4.3.0
  equatable: ^2.0.5
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/l10n/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
