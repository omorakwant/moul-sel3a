<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#E65A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Saffron Squircle Tile -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>
  <!-- White Arabic Calligraphic 'ل' for L'Carnet B2B -->
  <text x="50%" y="60%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="320" fill="#FAF9F7" text-anchor="middle" dominant-baseline="central" filter="url(#glow)">ل</text>
</svg>
