<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="L'Carnet B2B — Digitizing the Rolling Debt for Morocco's B2B Phone Accessory Market.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="L'Carnet B2B">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>L'Carnet B2B</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    body {
      margin: 0;
      background-color: #000000;
      color: #FAF9F7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }
    .brand-logo-tile {
      width: 80px;
      height: 80px;
      background: #FF6B00;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 800;
      color: #FAF9F7;
      box-shadow: 0 0 40px rgba(255, 107, 0, 0.45);
      margin-bottom: 24px;
      animation: pulse-glow 2.2s infinite ease-in-out;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .brand-title span {
      color: #FF6B00;
    }
    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 28px;
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 107, 0, 0.2);
      border-top-color: #FF6B00;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-glow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 32px rgba(255, 107, 0, 0.35);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 52px rgba(255, 107, 0, 0.65);
      }
    }
  </style>

  <div id="loading-container">
    <div class="brand-logo-tile">ل</div>
    <div class="brand-title">L'Carnet <span>B2B</span></div>
    <div class="brand-subtitle">Chargement du prototype interactif...</div>
    <div class="loading-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
