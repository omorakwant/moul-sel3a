name: Deploy Flutter Web App to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-app-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 1. Set Up Flutter SDK ──
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      # ── 2. Build Flutter Web ──
      - name: Build Flutter Web App
        working-directory: ./app
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release

      # ── 3. Deploy to Cloudflare Pages via Wrangler ──
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/build/web --project-name=lcarnet-app --commit-dirty=true
