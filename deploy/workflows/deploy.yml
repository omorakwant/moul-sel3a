name: Build & Deploy L'Carnet B2B (Unified Landing + Flutter Prototype)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js Landing & Flutter Prototype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 1. Set Up Flutter SDK & Cache ──
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      # ── 2. Build Flutter Web Prototype ──
      - name: Build Flutter Web App
        working-directory: ./app
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release --base-href /prototype/

      # ── 3. Set Up Node.js & Cache ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: lcarnet-b2b-landing/package-lock.json

      # ── 4. Copy Flutter Build to Next.js Public Directory ──
      - name: Merge Flutter Web into Next.js Public Prototype
        run: |
          mkdir -p lcarnet-b2b-landing/public/prototype
          cp -r app/build/web/* lcarnet-b2b-landing/public/prototype/
          echo "Merged Flutter assets:"
          ls -la lcarnet-b2b-landing/public/prototype/

      # ── 5. Build Next.js Landing Site ──
      - name: Install Next.js Dependencies
        working-directory: ./lcarnet-b2b-landing
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: ./lcarnet-b2b-landing
        run: npm run build

      # ── 6. Prepare Artifact for GitHub Pages ──
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./lcarnet-b2b-landing/out

  # ── 7. Automatic Deployment to GitHub Pages (100% Free) ──
  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
